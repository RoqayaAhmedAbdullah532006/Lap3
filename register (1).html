
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - التسجيل</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>صفحة التسجيل 📝</h1>
        <p>املئي بياناتك للانضمام إلينا</p>

        <nav>
            <a href="profile.html">الصفحة الشخصية</a>
            <a href="register.html">التسجيل</a>
        </nav>
    </header>

    <main class="register-main">
        <section class="register-card">
            <h2>إنشاء حساب</h2>
            <p>من فضلك أدخلي البيانات التالية.</p>
            <p id="msg"></p>
            <form id="registerForm">

            <form action="#" method="get">

                <label for="name">الاسم الكامل</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="اكتبي اسمك"
                    required>

                <label for="email">البريد الإلكتروني</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="example@email.com"
                    required>

                <label for="pass">كلمة المرور</label>
                <input
                    type="password"
                    id="pass"
                    name="pass"
                    minlength="6"
                    placeholder="6 أحرف على الأقل"
                    required>

                <label for="phone">رقم الهاتف</label>
                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="اختياري">

                <label for="level">الفرقة الدراسية</label>
                <select id="level" name="level" required>
                    <option value="">اختاري الفرقة</option>
                    <option value="1">الفرقة الأولى</option>
                    <option value="2">الفرقة الثانية</option>
                    <option value="3">الفرقة الثالثة</option>
                    <option value="4">الفرقة الرابعة</option>
                </select>

                <label class="checkbox-label" for="news">
                    <input type="checkbox" id="news" name="news" value="yes">
                    أريد استلام أخبار الكورس
                </label>

                <button type="submit">سجّلي الآن</button>
            </form>

            <p class="back-link">
                عندك صفحة بروفايل؟
                <a href="profile.html">ارجعي إليها</a>
            </p>
        </section>
    </main>

    <footer>
        <p>معمل برمجة الويب - 2026</p>
    </footer>
<script src="register.js"></script>
</body>
</html>
